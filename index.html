<!DOCTYPE html><html lang="ru" class="theme-dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>My Telegram</title><style>:root{--tg-primary:#8774e1;--tg-bg:#212121;--tg-sidebar:#212121;--tg-chat:#0f0f0f;--tg-msg-in:#212121;--tg-msg-out:#766ac8;--tg-text:#fff;--tg-text-muted:#aaa;--tg-border:#303030;--tg-hover:#2c2c2c;--tg-input:#2b2b2b;--radius:15px}*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}body{background:var(--tg-bg);color:var(--tg-text);height:100vh;overflow:hidden;display:flex;transition:background .3s}#auth-screen{position:fixed;inset:0;background:var(--tg-bg);z-index:100;display:flex;align-items:center;justify-content:center}.auth-box{width:360px;padding:40px;background:var(--tg-sidebar);border-radius:12px;box-shadow:0 4px 30px rgba(0,0,0,.1);text-align:center;border:1px solid var(--tg-border)}.auth-box h1{margin-bottom:20px;font-size:24px;color:var(--tg-primary)}.auth-input{width:100%;padding:14px;margin-bottom:10px;background:var(--tg-input);border:1px solid var(--tg-border);border-radius:10px;color:var(--tg-text);outline:none;font-size:15px;transition:border .2s}.auth-input:focus{border-bottom:2px solid var(--tg-primary)}.auth-btn{width:100%;padding:14px;background:var(--tg-primary);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px;transition:background .2s}.auth-btn:hover{background:#7c71c6}.auth-switch{margin-top:15px;font-size:14px;color:var(--tg-text-muted)}.auth-switch a{color:var(--tg-primary);cursor:pointer;text-decoration:none}.auth-error{color:#e74c6f;font-size:13px;margin-top:10px;min-height:16px}#app{display:none;width:100%;height:100%;position:relative}.sidebar{width:340px;background:var(--tg-sidebar);border-right:1px solid var(--tg-border);display:flex;flex-direction:column;height:100%}.sidebar-header{padding:10px 16px;display:flex;align-items:center;gap:10px;height:60px}.menu-btn{background:none;border:none;font-size:20px;color:var(--tg-text-muted);cursor:pointer;padding:8px;border-radius:50%;transition:background .2s}.menu-btn:hover{background:var(--tg-hover)}.search-input{flex:1;background:var(--tg-input);border:none;border-radius:20px;padding:10px 15px;color:var(--tg-text);outline:none;font-size:15px}.chat-list{flex:1;overflow-y:auto;padding:0 8px}.chat-item{display:flex;padding:10px;gap:12px;cursor:pointer;transition:background .15s;border-radius:10px;margin-bottom:2px}.chat-item:hover{background:var(--tg-hover)}.chat-item.active{background:var(--tg-primary)}.chat-item.active .chat-time,.chat-item.active .chat-last{color:rgba(255,255,255,.8)}.avatar{width:54px;height:54px;border-radius:50%;background:var(--tg-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;flex-shrink:0}.chat-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}.chat-top{display:flex;justify-content:space-between;margin-bottom:4px}.chat-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-time{font-size:12px;color:var(--tg-text-muted)}.chat-last{font-size:14px;color:var(--tg-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main-chat{flex:1;display:flex;flex-direction:column;background:var(--tg-chat);height:100%}.chat-header{height:60px;padding:0 20px;background:var(--tg-sidebar);border-bottom:1px solid var(--tg-border);display:flex;align-items:center;gap:12px}.chat-header .chat-name{font-size:16px}.chat-header .chat-status{font-size:13px;color:var(--tg-text-muted);margin-top:2px}.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px}.msg{max-width:65%;padding:8px 14px;border-radius:var(--radius);background:var(--tg-msg-in);align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.2);position:relative;font-size:15px;line-height:1.4}.msg.out{background:var(--tg-msg-out);align-self:flex-end;border-bottom-right-radius:4px}.msg:not(.out){border-bottom-left-radius:4px}.msg-author{font-size:13px;color:var(--tg-primary);font-weight:500;margin-bottom:4px}.msg.out .msg-author{color:#fff;opacity:.8}.msg-text{font-size:15px;line-height:1.4;word-wrap:break-word}.msg-time{font-size:11px;color:var(--tg-text-muted);float:right;margin:4px 0 0 10px}.msg.out .msg-time{color:rgba(255,255,255,.7)}.msg-gift-text{font-size:40px;text-align:center;margin-bottom:5px}.msg-gift-name{font-size:12px;color:var(--tg-text-muted);text-align:center;font-weight:500}.input-area{padding:10px 20px;background:var(--tg-sidebar);display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--tg-border)}.msg-input{flex:1;background:var(--tg-input);border:none;border-radius:20px;padding:12px 18px;color:var(--tg-text);outline:none;resize:none;min-height:48px;max-height:120px;font-size:15px}.send-btn{background:var(--tg-primary);color:#fff;border:none;border-radius:50%;width:48px;height:48px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:background .2s}.send-btn:hover{background:#7c71c6}.side-menu{position:absolute;top:0;left:-340px;width:340px;height:100%;background:var(--tg-sidebar);z-index:10;transition:left .3s cubic-bezier(0.1,0.7,0.1,1);display:flex;flex-direction:column;box-shadow:2px 0 10px rgba(0,0,0,.2)}.side-menu.open{left:0}.side-menu-header{padding:20px;border-bottom:1px solid var(--tg-border);display:flex;justify-content:space-between;align-items:center}.side-menu-profile{padding:20px;display:flex;flex-direction:column;align-items:center;border-bottom:1px solid var(--tg-border)}.side-menu-item{padding:15px 20px;display:flex;align-items:center;gap:15px;cursor:pointer;font-size:15px;color:var(--tg-text);transition:background .15s;margin:0 8px;border-radius:10px}.side-menu-item:hover{background:var(--tg-hover)}.settings-modal,.profile-modal,.gift-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(5px)}.modal-content{background:var(--tg-sidebar);width:400px;border-radius:12px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.4);border:1px solid var(--tg-border)}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:18px;font-weight:500}.close-modal{background:none;border:none;font-size:24px;cursor:pointer;color:var(--tg-text-muted)}.setting-item{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--tg-border)}.setting-item:last-child{border-bottom:none}.gift-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.gift-item{padding:10px;border:1px solid var(--tg-border);border-radius:10px;text-align:center;cursor:pointer;font-size:12px;transition:background .2s}.gift-item:hover{background:var(--tg-hover)}.gift-emoji{font-size:28px;display:block;margin-bottom:5px}.admin-badge{background:var(--tg-primary);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;margin-left:5px}.gold-text{color:#d4b96a;text-shadow:0 0 10px rgba(212,185,106,.5)}</style></head><body><div id="auth-screen"><div class="auth-box"><h1 id="auth-title">Вход</h1><input type="text" id="auth-login" class="auth-input" placeholder="Логин"><input type="password" id="auth-password" class="auth-input" placeholder="Пароль"><button class="auth-btn" id="auth-btn" onclick="submitAuth()">ВОЙТИ</button><div class="auth-switch" id="auth-switch">Нет аккаунта? <a onclick="switchAuthMode()">Зарегистрироваться</a></div><div class="auth-error" id="auth-error"></div></div></div><div id="app"><div class="sidebar"><div class="side-menu" id="side-menu"><div class="side-menu-header"><span>Меню</span><button class="close-modal" onclick="toggleMenu()">×</button></div><div class="side-menu-profile"><div class="avatar" id="my-avatar" style="width:70px;height:70px;font-size:28px;">?</div><div class="chat-name" id="my-name" style="margin-top:10px;font-size:18px;">Имя</div><div style="color:var(--tg-text-muted);font-size:13px;" id="my-login">@login</div></div><div class="side-menu-item" onclick="openSettings()">⚙️ Настройки</div><div class="side-menu-item" onclick="openProfile()">👤 Профиль</div><div class="side-menu-item" onclick="openGift()">🎁 Подарки</div><div class="side-menu-item" onclick="toggleMenu()">❌ Закрыть</div></div><div class="sidebar-header"><button class="menu-btn" onclick="toggleMenu()">☰</button><button class="menu-btn" onclick="openNewChat()">✏️</button></div><div class="search-container" style="padding:0 16px 10px;"><input type="text" class="search-input" placeholder="Поиск"></div><div class="chat-list" id="chat-list"></div></div><div class="main-chat"><div class="chat-header"><div class="chat-header-left" style="display:flex;align-items:center;gap:12px;"><div class="avatar" id="header-avatar" style="width:40px;height:40px;font-size:16px;">#</div><div><div class="chat-name" id="header-name">Общий чат</div><div class="chat-status" id="header-status">сейчас в сети</div></div></div></div><div class="messages" id="messages"></div><div class="input-area"><button class="menu-btn" onclick="openGift()">🎁</button><textarea class="msg-input" id="msg-input" rows="1" placeholder="Написать сообщение..."></textarea><button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button></div></div></div><div class="settings-modal" id="settings-modal"><div class="modal-content"><div class="modal-header"><span>Настройки</span><button class="close-modal" onclick="closeModal('settings-modal')">×</button></div><div class="setting-item"><span>Промокод</span><div><input type="text" id="promo-input" placeholder="OWNER-XXXX" style="background:var(--tg-input);border:1px solid var(--tg-border);color:#fff;padding:5px 10px;border-radius:5px;width:120px;margin-right:5px;"><button onclick="applyPromo()" style="background:var(--tg-primary);color:#fff;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;">OK</button></div></div><div class="setting-item"><span>Очистить чат</span><button class="menu-btn" style="color:#e74c6f;" onclick="clearChat()">🗑</button></div></div></div><div class="profile-modal" id="profile-modal"><div class="modal-content"><div class="modal-header"><span>Мой профиль</span><button class="close-modal" onclick="closeModal('profile-modal')">×</button></div><div style="text-align:center;"><div class="avatar" id="profile-avatar" style="width:80px;height:80px;font-size:32px;margin:0 auto;">?</div><h3 id="profile-name" style="margin-top:15px;font-weight:500;">Имя</h3><p style="color:var(--tg-text-muted);" id="profile-login">@login</p><p style="margin-top:10px;font-size:14px;color:var(--tg-primary);" id="profile-status">В сети</p><p id="profile-role" style="margin-top:5px;font-size:12px;"></p></div></div></div><div class="gift-modal" id="gift-modal"><div class="modal-content"><div class="modal-header"><span>Подарить</span><button class="close-modal" onclick="closeModal('gift-modal')">×</button></div><div class="gift-grid"><div class="gift-item" onclick="sendGift('🎂','Торт')"><span class="gift-emoji">🎂</span>Торт</div><div class="gift-item" onclick="sendGift('🌹','Роза')"><span class="gift-emoji">🌹</span>Роза</div><div class="gift-item" onclick="sendGift('🍺','Пиво')"><span class="gift-emoji">🍺</span>Пиво</div><div class="gift-item" onclick="sendGift('🔥','Огонь')"><span class="gift-emoji">🔥</span>Огонь</div><div class="gift-item" onclick="sendGift('⭐','Звезда')"><span class="gift-emoji">⭐</span>Звезда</div><div class="gift-item" onclick="sendGift('💎','Алмаз')"><span class="gift-emoji">💎</span>Алмаз</div><div class="gift-item" onclick="sendGift('👑','Корона')"><span class="gift-emoji">👑</span>Корона</div><div class="gift-item" onclick="sendGift('🚀','Ракета')"><span class="gift-emoji">🚀</span>Ракета</div></div></div></div><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyB-n2wL94hvryB-56V9Mydna57qWJTaUDE",authDomain:"ssss-b2af1.firebaseapp.com",databaseURL:"https://ssss-b2af1-default-rtdb.firebaseio.com",projectId:"ssss-b2af1",storageBucket:"ssss-b2af1.firebasestorage.app",messagingSenderId:"992229397721",appId:"1:992229397721:web:7850439a92db4faa341ac8"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let currentUser=null,currentRoom='general',authMode='login',messagesRef=null,isAdmin=false;function hashPass(p){return btoa(encodeURIComponent(p))}function switchAuthMode(){authMode=authMode==='login'?'register':'login';document.getElementById('auth-title').textContent=authMode==='login'?'Вход':'Регистрация';document.getElementById('auth-btn').textContent=authMode==='login'?'ВОЙТИ':'СОЗДАТЬ АККАУНТ';document.getElementById('auth-switch').innerHTML=authMode==='login'?'Нет аккаунта? <a onclick="switchAuthMode()">Зарегистрироваться</a>':'Уже есть аккаунт? <a onclick="switchAuthMode()">Войти</a>';document.getElementById('auth-error').textContent=''}function submitAuth(){const login=document.getElementById('auth-login').value.trim().toLowerCase(),pass=document.getElementById('auth-password').value,errorEl=document.getElementById('auth-error'),btn=document.getElementById('auth-btn');errorEl.textContent='';if(!login||!pass){errorEl.textContent='Заполни поля';return}if(login.length<3){errorEl.textContent='Логин от 3 символов';return}btn.disabled=true;btn.textContent='Загрузка...';const userRef=db.ref('accounts/'+login);userRef.once('value').then(snap=>{const exists=snap.exists();if(authMode==='register'){if(exists){errorEl.textContent='Логин занят';btn.disabled=false;btn.textContent='СОЗДАТЬ АККАУНТ';return}userRef.set({login:login,password:hashPass(pass),created:Date.now(),role:'user'}).then(()=>enterApp(login))}else{if(!exists){errorEl.textContent='Не найден';btn.disabled=false;btn.textContent='ВОЙТИ';return}if(snap.val().password!==hashPass(pass)){errorEl.textContent='Неверный пароль';btn.disabled=false;btn.textContent='ВОЙТИ';return}enterApp(login)}}).catch(e=>{console.error(e);errorEl.textContent='Ошибка базы. Проверь правила Firebase.';btn.disabled=false;btn.textContent='ВОЙТИ'})}function enterApp(login){currentUser=login;document.getElementById('auth-screen').style.display='none';document.getElementById('app').style.display='flex';document.getElementById('my-avatar').textContent=login[0].toUpperCase();document.getElementById('my-name').textContent=login;document.getElementById('my-login').textContent='@'+login;checkRole();renderChatList();loadMessages('general','Общий чат');setupInput()}function checkRole(){db.ref('roles/'+currentUser).on('value',snap=>{if(snap.exists()&&snap.val()==='owner'){isAdmin=true;document.getElementById('profile-role').innerHTML='<span class="gold-text">👑 Основатель</span>';}})}function toggleMenu(){document.getElementById('side-menu').classList.toggle('open')}function renderChatList(){const list=document.getElementById('chat-list');list.innerHTML=`<div class="chat-item active" onclick="loadMessages('general','Общий чат')"><div class="avatar">#</div><div class="chat-info"><div class="chat-top"><div class="chat-name">Общий чат</div></div><div class="chat-last">Главный чат</div></div></div>`}function loadMessages(roomId,roomName){currentRoom=roomId;document.getElementById('header-name').textContent=roomName;document.getElementById('header-avatar').textContent=roomName[0];const messagesDiv=document.getElementById('messages');messagesDiv.innerHTML='<div style="text-align:center;color:var(--tg-text-muted);margin-top:20px;">Загрузка...</div>';if(messagesRef)messagesRef.off();messagesRef=db.ref('messages/'+roomId).limitToLast(50);messagesRef.on('value',snap=>{messagesDiv.innerHTML='';snap.forEach(child=>{const msg=child.val(),isMine=msg.author===currentUser,time=new Date(msg.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),msgEl=document.createElement('div');msgEl.className='msg'+(isMine?' out':'');if(msg.isGift){msgEl.innerHTML=`${!isMine?`<div class="msg-author">${escapeHtml(msg.author)}</div>`:''}<div class="msg-gift-text">${msg.text}</div><div class="msg-gift-name">${msg.giftName}</div><div class="msg-time">${time}</div>`}else{msgEl.innerHTML=`${!isMine?`<div class="msg-author">${escapeHtml(msg.author)}</div>`:''}<div class="msg-text">${escapeHtml(msg.text)}</div><div class="msg-time">${time}</div>`}messagesDiv.appendChild(msgEl)});messagesDiv.scrollTop=messagesDiv.scrollHeight})}function sendMessage(){const input=document.getElementById('msg-input'),text=input.value.trim();if(!text||!currentUser)return;db.ref('messages/'+currentRoom).push({author:currentUser,text:text,time:Date.now()}).then(()=>{input.value='';input.style.height='auto'})}function sendGift(emoji,giftName){if(!currentUser)return;db.ref('messages/'+currentRoom).push({author:currentUser,text:emoji,giftName:giftName,isGift:true,time:Date.now()}).then(()=>{closeModal('gift-modal')})}function openSettings(){toggleMenu();document.getElementById('settings-modal').style.display='flex'}function openProfile(){toggleMenu();document.getElementById('profile-avatar').textContent=currentUser[0].toUpperCase();document.getElementById('profile-name').textContent=currentUser;document.getElementById('profile-login').textContent='@'+currentUser;document.getElementById('profile-modal').style.display='flex'}function openGift(){document.getElementById('gift-modal').style.display='flex'}function openNewChat(){toggleMenu();alert('Создание чатов в разработке')}function closeModal(id){document.getElementById(id).style.display='none'}function setupInput(){const input=document.getElementById('msg-input');input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'})}function escapeHtml(text){if(!text)return '';return String(text).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function clearChat(){if(!currentUser)return;if(confirm('Очистить чат?')){db.ref('messages/'+currentRoom).remove()}}function applyPromo(){const code=document.getElementById('promo-input').value.trim().toUpperCase();if(code==='OWNER-1337-FOREVER'){db.ref('roles/'+currentUser).set('owner').then(()=>{alert('👑 Промокод активирован! Вы теперь основатель.');isAdmin=true;document.getElementById('profile-role').innerHTML='<span class="gold-text">👑 Основатель</span>';closeModal('settings-modal')})}else{alert('Неверный промокод')}}window.addEventListener('load',()=>{document.getElementById('auth-login').focus()})</script></body></html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Telegram</title>
<style>
    :root {
        --tg-blue: #3390ec;
        --tg-bg: #ffffff;
        --tg-sidebar: #ffffff;
        --tg-chat-bg: #e6ebee;
        --tg-msg-in: #ffffff;
        --tg-msg-out: #eeffde;
        --tg-text: #000000;
        --tg-text-muted: #707579;
        --tg-border: #dfe1e5;
        --tg-hover: #f4f4f5;
        --tg-input-bg: #f4f4f5;
    }
    body.dark {
        --tg-bg: #212121;
        --tg-sidebar: #212121;
        --tg-chat-bg: #0f0f0f;
        --tg-msg-in: #212121;
        --tg-msg-out: #766ac8;
        --tg-text: #ffffff;
        --tg-text-muted: #aaaaaa;
        --tg-border: #303030;
        --tg-hover: #2b2b2b;
        --tg-input-bg: #2b2b2b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--tg-bg); color: var(--tg-text); height: 100vh; overflow: hidden; display: flex; transition: background 0.3s; }

    /* ЭКРАН ВХОДА */
    #auth-screen {
        position: fixed; inset: 0; background: var(--tg-bg); z-index: 100;
        display: flex; align-items: center; justify-content: center;
    }
    .auth-box {
        width: 360px; padding: 40px; background: var(--tg-sidebar);
        border-radius: 12px; box-shadow: 0 4px 30px rgba(0,0,0,0.1); text-align: center;
    }
    .auth-box h1 { margin-bottom: 20px; font-size: 24px; color: var(--tg-blue); }
    .auth-input {
        width: 100%; padding: 14px; margin-bottom: 10px; background: var(--tg-input-bg);
        border: 1px solid var(--tg-border); border-radius: 10px; color: var(--tg-text); outline: none; font-size: 15px;
    }
    .auth-input:focus { border-color: var(--tg-blue); }
    .auth-btn {
        width: 100%; padding: 14px; background: var(--tg-blue); color: white;
        border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px;
    }
    .auth-btn:hover { opacity: 0.9; }
    .auth-switch { margin-top: 15px; font-size: 14px; color: var(--tg-text-muted); }
    .auth-switch a { color: var(--tg-blue); cursor: pointer; text-decoration: none; }
    .auth-error { color: #e74c6f; font-size: 13px; margin-top: 10px; min-height: 16px; }

    /* ОСНОВНОЙ ИНТЕРФЕЙС */
    #app { display: none; width: 100%; height: 100%; }

    /* ЛЕВАЯ ПАНЕЛЬ */
    .sidebar { width: 320px; background: var(--tg-sidebar); border-right: 1px solid var(--tg-border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 10px 16px; display: flex; align-items: center; gap: 10px; height: 60px; }
    .theme-btn { background: none; border: none; font-size: 20px; color: var(--tg-text-muted); cursor: pointer; }
    .search-input { flex: 1; background: var(--tg-input-bg); border: none; border-radius: 20px; padding: 10px 15px; color: var(--tg-text); outline: none; }
    
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item { display: flex; padding: 10px 16px; gap: 12px; cursor: pointer; transition: background 0.1s; }
    .chat-item:hover { background: var(--tg-hover); }
    .chat-item.active { background: var(--tg-blue); color: white; }
    .chat-item.active .chat-time, .chat-item.active .chat-last { color: rgba(255,255,255,0.8); }
    
    .avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--tg-blue); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; flex-shrink: 0; }
    .chat-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .chat-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .chat-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-time { font-size: 12px; color: var(--tg-text-muted); }
    .chat-last { font-size: 14px; color: var(--tg-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ПРАВАЯ ПАНЕЛЬ */
    .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--tg-chat-bg); }
    .chat-header { height: 60px; padding: 0 16px; background: var(--tg-sidebar); border-bottom: 1px solid var(--tg-border); display: flex; align-items: center; gap: 12px; }
    .chat-header .chat-name { font-size: 16px; }
    .chat-header .chat-status { font-size: 13px; color: var(--tg-text-muted); }
    
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 65%; padding: 8px 12px; border-radius: 12px; background: var(--tg-msg-in); align-self: flex-start; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; }
    .msg.out { background: var(--tg-msg-out); align-self: flex-end; }
    .msg-author { font-size: 13px; color: var(--tg-blue); font-weight: 600; margin-bottom: 4px; }
    .msg.out .msg-author { color: #5a4db0; }
    .msg-text { font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .msg-time { font-size: 11px; color: var(--tg-text-muted); float: right; margin: 4px 0 0 10px; }
    .msg.out .msg-time { color: rgba(0,0,0,0.5); }

    .input-area { padding: 10px 20px; background: var(--tg-sidebar); display: flex; gap: 10px; align-items: flex-end; }
    .msg-input { flex: 1; background: var(--tg-input-bg); border: none; border-radius: 20px; padding: 12px 16px; color: var(--tg-text); outline: none; resize: none; min-height: 44px; max-height: 120px; font-size: 15px; }
    .send-btn { background: var(--tg-blue); color: white; border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .send-btn:hover { opacity: 0.9; }
</style>
</head>
<body class="dark">

    <!-- ЭКРАН ВХОДА -->
    <div id="auth-screen">
        <div class="auth-box">
            <h1 id="auth-title">Вход</h1>
            <input type="text" id="auth-login" class="auth-input" placeholder="Логин">
            <input type="password" id="auth-password" class="auth-input" placeholder="Пароль">
            <button class="auth-btn" id="auth-btn" onclick="submitAuth()">ВОЙТИ</button>
            <div class="auth-switch" id="auth-switch">Нет аккаунта? <a onclick="switchAuthMode()">Зарегистрироваться</a></div>
            <div class="auth-error" id="auth-error"></div>
        </div>
    </div>

    <!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="app">
        <!-- ЛЕВАЯ ПАНЕЛЬ -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="theme-btn" onclick="toggleTheme()">🌙</button>
                <input type="text" class="search-input" placeholder="Поиск">
            </div>
            <div class="chat-list" id="chat-list">
                <!-- Сюда будут добавляться чаты -->
            </div>
        </div>

        <!-- ПРАВАЯ ПАНЕЛЬ -->
        <div class="main-chat">
            <div class="chat-header">
                <div class="avatar" id="header-avatar" style="width:40px;height:40px;font-size:16px;">#</div>
                <div>
                    <div class="chat-name" id="header-name">Общий чат</div>
                    <div class="chat-status" id="header-status">сейчас в сети</div>
                </div>
            </div>

            <div class="messages" id="messages">
                <!-- Сюда будут лететь сообщения -->
            </div>

            <div class="input-area">
                <textarea class="msg-input" id="msg-input" rows="1" placeholder="Написать сообщение..."></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // --- КОНФИГ FIREBASE (ТВОЙ) ---
        const firebaseConfig = {
            apiKey: "AIzaSyB-n2wL94hvryB-56V9Mydna57qWJTaUDE",
            authDomain: "ssss-b2af1.firebaseapp.com",
            databaseURL: "https://ssss-b2af1-default-rtdb.firebaseio.com",
            projectId: "ssss-b2af1",
            storageBucket: "ssss-b2af1.firebasestorage.app",
            messagingSenderId: "992229397721",
            appId: "1:992229397721:web:7850439a92db4faa341ac8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- ПЕРЕМЕННЫЕ ---
        let currentUser = null;
        let currentRoom = 'general';
        let authMode = 'login';
        let messagesRef = null;

        // --- АВТОРИЗАЦИЯ ---
        function hashPass(p) { return btoa(encodeURIComponent(p)); }

        function switchAuthMode() {
            authMode = authMode === 'login' ? 'register' : 'login';
            document.getElementById('auth-title').textContent = authMode === 'login' ? 'Вход' : 'Регистрация';
            document.getElementById('auth-btn').textContent = authMode === 'login' ? 'ВОЙТИ' : 'СОЗДАТЬ АККАУНТ';
            document.getElementById('auth-switch').innerHTML = authMode === 'login' 
                ? 'Нет аккаунта? <a onclick="switchAuthMode()">Зарегистрироваться</a>'
                : 'Уже есть аккаунт? <a onclick="switchAuthMode()">Войти</a>';
            document.getElementById('auth-error').textContent = '';
        }

        function submitAuth() {
            const login = document.getElementById('auth-login').value.trim().toLowerCase();
            const pass = document.getElementById('auth-password').value;
            const errorEl = document.getElementById('auth-error');
            const btn = document.getElementById('auth-btn');
            
            errorEl.textContent = '';
            if (!login || !pass) { errorEl.textContent = 'Заполни все поля'; return; }
            if (login.length < 3) { errorEl.textContent = 'Логин от 3 символов'; return; }

            btn.disabled = true;
            btn.textContent = 'Загрузка...';

            const userRef = db.ref('accounts/' + login);

            userRef.once('value').then(snapshot => {
                const exists = snapshot.exists();

                if (authMode === 'register') {
                    if (exists) {
                        errorEl.textContent = 'Логин уже занят';
                        btn.disabled = false; btn.textContent = 'СОЗДАТЬ АККАУНТ';
                        return;
                    }
                    userRef.set({ login: login, password: hashPass(pass), created: Date.now() })
                        .then(() => enterApp(login));
                } else {
                    if (!exists) {
                        errorEl.textContent = 'Аккаунт не найден';
                        btn.disabled = false; btn.textContent = 'ВОЙТИ';
                        return;
                    }
                    if (snapshot.val().password !== hashPass(pass)) {
                        errorEl.textContent = 'Неверный пароль';
                        btn.disabled = false; btn.textContent = 'ВОЙТИ';
                        return;
                    }
                    enterApp(login);
                }
            }).catch(err => {
                console.error(err);
                errorEl.textContent = 'Ошибка базы данных. Проверь правила Firebase.';
                btn.disabled = false; btn.textContent = 'ВОЙТИ';
            });
        }

        // --- ЗАПУСК ПРИЛОЖЕНИЯ ---
        function enterApp(login) {
            currentUser = login;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            
            // Добавляем общий чат в список
            renderChatList();
            loadMessages('general');
            setupInput();
        }

        // --- СПИСОК ЧАТОВ ---
        function renderChatList() {
            const list = document.getElementById('chat-list');
            list.innerHTML = `
                <div class="chat-item active" onclick="loadMessages('general')">
                    <div class="avatar">#</div>
                    <div class="chat-info">
                        <div class="chat-top">
                            <div class="chat-name">Общий чат</div>
                            <div class="chat-time">сейчас</div>
                        </div>
                        <div class="chat-last">Главный чат</div>
                    </div>
                </div>
            `;
        }

        // --- ЗАГРУЗКА СООБЩЕНИЙ ---
        function loadMessages(roomId) {
            currentRoom = roomId;
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '<div style="text-align:center; color: var(--tg-text-muted); margin-top: 20px;">Загрузка...</div>';

            if (messagesRef) messagesRef.off();

            messagesRef = db.ref('messages/' + roomId).limitToLast(50);
            messagesRef.on('value', snapshot => {
                messagesDiv.innerHTML = '';
                snapshot.forEach(child => {
                    const msg = child.val();
                    const isMine = msg.author === currentUser;
                    
                    const time = new Date(msg.time).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

                    const msgEl = document.createElement('div');
                    msgEl.className = 'msg' + (isMine ? ' out' : '');
                    msgEl.innerHTML = `
                        ${!isMine ? `<div class="msg-author">${escapeHtml(msg.author)}</div>` : ''}
                        <div class="msg-text">${escapeHtml(msg.text)}</div>
                        <div class="msg-time">${time}</div>
                    `;
                    messagesDiv.appendChild(msgEl);
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }

        // --- ОТПРАВКА СООБЩЕНИЙ ---
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            db.ref('messages/' + currentRoom).push({
                author: currentUser,
                text: text,
                time: Date.now()
            }).then(() => {
                input.value = '';
                input.style.height = 'auto';
            });
        }

        // --- УТИЛИТЫ ---
        function setupInput() {
            const input = document.getElementById('msg-input');
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            input.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        // Запуск при загрузке
        window.addEventListener('load', () => {
            document.getElementById('auth-login').focus();
        });
    </script>
</body>
</html>

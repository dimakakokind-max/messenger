<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root, [data-theme="dark"] {
    --bg: #08080a;
    --bg-2: #0c0c10;
    --bg-3: #101014;
    --glass: rgba(22, 22, 28, 0.55);
    --glass-2: rgba(30, 30, 38, 0.45);
    --glass-3: rgba(40, 40, 50, 0.35);
    --glass-border: rgba(255, 255, 255, 0.06);
    --glass-border-hover: rgba(255, 255, 255, 0.14);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --text: #e8e8ee;
    --text-2: #a8a8b4;
    --text-3: #6a6a78;
    --text-4: #3a3a48;
    --divider: rgba(255, 255, 255, 0.05);
    --hover: rgba(255, 255, 255, 0.04);
    --input-bg: rgba(0, 0, 0, 0.3);
    --accent: #d0d0dc;
    --my-msg: rgba(74, 124, 255, 0.15);
    --my-msg-border: rgba(74, 124, 255, 0.3);
}

[data-theme="light"] {
    --bg: #f5f5f7;
    --bg-2: #ececef;
    --bg-3: #e5e5ea;
    --glass: rgba(255, 255, 255, 0.7);
    --glass-2: rgba(255, 255, 255, 0.55);
    --glass-3: rgba(255, 255, 255, 0.4);
    --glass-border: rgba(0, 0, 0, 0.06);
    --glass-border-hover: rgba(0, 0, 0, 0.12);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    --text: #1a1a20;
    --text-2: #55555f;
    --text-3: #8a8a94;
    --text-4: #b8b8c0;
    --divider: rgba(0, 0, 0, 0.05);
    --hover: rgba(0, 0, 0, 0.03);
    --input-bg: rgba(0, 0, 0, 0.03);
    --accent: #2a2a32;
    --my-msg: rgba(74, 124, 255, 0.1);
    --my-msg-border: rgba(74, 124, 255, 0.25);
}

* { transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease; }

html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
}

body::before {
    content: '';
    position: fixed;
    top: -20%; left: -10%;
    width: 60%; height: 60%;
    background: radial-gradient(circle, var(--glass-border) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
}

/* ==================== ЭКРАН ВХОДА ==================== */
.login-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 1000;
    padding: 20px;
}

.login-card {
    background: var(--glass);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border-hover);
    border-radius: 24px;
    padding: 40px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    text-align: center;
    position: relative;
    overflow: hidden;
}

.login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-border-hover), transparent);
}

.login-icon {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, var(--glass-3), var(--glass-2));
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    color: var(--text-2);
}

.login-icon svg { width: 32px; height: 32px; }

.login-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    letter-spacing: -0.02em;
}

.login-sub {
    font-size: 13px;
    color: var(--text-3);
    margin-bottom: 28px;
}

.login-input {
    width: 100%;
    padding: 15px 18px;
    background: var(--input-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    text-align: center;
    transition: all 0.2s;
    margin-bottom: 12px;
}

.login-input:focus {
    border-color: var(--glass-border-hover);
    background: var(--glass-2);
}

.login-input::placeholder { color: var(--text-4); }

.login-btn {
    width: 100%;
    padding: 15px;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
}

.login-btn:hover {
    transform: scale(1.02);
    opacity: 0.9;
}

.login-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.login-error {
    color: #c25a6a;
    font-size: 12px;
    margin-top: 12px;
    min-height: 16px;
}

/* ==================== ОСНОВНОЙ ИНТЕРФЕЙС ==================== */
.app {
    display: grid;
    grid-template-columns: 300px 1fr;
    height: 100vh;
    position: relative;
    z-index: 1;
}

/* SIDEBAR */
.sidebar {
    background: var(--glass);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-right: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-header {
    padding: 20px;
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.sidebar-logo {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text);
    text-transform: uppercase;
}

.sidebar-logo span { color: var(--text-3); font-weight: 400; }

.sidebar-actions {
    display: flex;
    gap: 6px;
}

.icon-btn {
    width: 32px;
    height: 32px;
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

.icon-btn:hover {
    border-color: var(--glass-border-hover);
    color: var(--text);
}

.icon-btn svg { width: 14px; height: 14px; }

.user-info {
    padding: 16px 20px;
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    gap: 12px;
}

.user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4a7cff, #6a5acd);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 0 15px rgba(74, 124, 255, 0.3);
}

.user-info-text {
    min-width: 0;
    flex: 1;
}

.user-info-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.user-info-status {
    font-size: 11px;
    color: #4ade80;
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 4px;
}

.status-dot {
    width: 6px;
    height: 6px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 8px #4ade80;
}

.rooms-header {
    padding: 16px 20px 8px;
    font-size: 10px;
    color: var(--text-4);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
}

.rooms-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px 16px;
}

.room-item {
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
    margin-bottom: 2px;
    border: none;
    background: none;
    font-family: inherit;
    width: 100%;
    text-align: left;
}

.room-item:hover {
    background: var(--hover);
    color: var(--text);
}

.room-item.active {
    background: var(--glass-2);
    color: var(--text);
}

.room-item-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--glass-3), var(--glass-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    flex-shrink: 0;
}

.room-item-info {
    min-width: 0;
    flex: 1;
}

.room-item-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.room-item-last {
    font-size: 11px;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
}

/* MAIN CHAT */
.chat-area {
    display: flex;
    flex-direction: column;
    background: var(--glass);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    overflow: hidden;
}

.chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
}

.chat-header-info {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.chat-header-avatar {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #4a7cff, #6a5acd);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    flex-shrink: 0;
}

.chat-header-text {
    min-width: 0;
}

.chat-header-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-header-sub {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 2px;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 3px; }
.chat-messages::-webkit-scrollbar-thumb:hover { background: var(--glass-border-hover); }

.message {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
    animation: msgIn 0.3s ease;
}

@keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.mine {
    flex-direction: row-reverse;
}

.msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--glass-3), var(--glass-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    flex-shrink: 0;
    border: 1px solid var(--glass-border);
}

.message.mine .msg-avatar {
    background: linear-gradient(135deg, #4a7cff, #6a5acd);
    color: #fff;
    border-color: transparent;
}

.msg-bubble {
    max-width: 65%;
    padding: 10px 14px;
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    word-wrap: break-word;
    position: relative;
}

.message.mine .msg-bubble {
    background: var(--my-msg);
    border-color: var(--my-msg-border);
}

.msg-author {
    font-size: 11px;
    font-weight: 700;
    color: #4a7cff;
    margin-bottom: 4px;
}

.message.mine .msg-author {
    text-align: right;
    color: #6a5acd;
}

.msg-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
}

.msg-time {
    font-size: 10px;
    color: var(--text-4);
    margin-top: 4px;
    text-align: right;
}

.chat-input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--glass-border);
    flex-shrink: 0;
}

.chat-input-wrapper {
    display: flex;
    gap: 10px;
    align-items: flex-end;
}

.chat-input {
    flex: 1;
    padding: 13px 18px;
    background: var(--input-bg);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
    resize: none;
    min-height: 46px;
    max-height: 120px;
    line-height: 1.5;
}

.chat-input:focus {
    border-color: var(--glass-border-hover);
    background: var(--glass-2);
}

.chat-input::placeholder { color: var(--text-4); }

.send-btn {
    width: 46px;
    height: 46px;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
}

.send-btn:hover {
    transform: scale(1.05);
}

.send-btn:active {
    transform: scale(0.95);
}

.send-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
}

.send-btn svg { width: 20px; height: 20px; }

.empty-chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-3);
    text-align: center;
    gap: 12px;
    padding: 40px;
}

.empty-chat-icon {
    font-size: 48px;
    opacity: 0.3;
    margin-bottom: 8px;
}

/* MODAL */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.active { display: flex; }

.modal {
    background: var(--glass);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid var(--glass-border-hover);
    border-radius: 20px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    animation: slideUp 0.3s ease;
    position: relative;
    overflow: hidden;
}

.modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-border-hover), transparent);
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.modal-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--divider);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
}

.modal-close {
    width: 30px;
    height: 30px;
    background: transparent;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.modal-close:hover { background: var(--hover); color: var(--text); }

.modal-body { padding: 20px 24px; }

.field { margin-bottom: 14px; }

.field label {
    display: block;
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 7px;
    font-weight: 500;
}

.field input {
    width: 100%;
    padding: 13px 15px;
    background: var(--input-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
}

.field input:focus {
    border-color: var(--glass-border-hover);
    background: var(--glass-2);
}

.field input::placeholder { color: var(--text-4); }

.modal-footer {
    padding: 14px 24px 20px;
    display: flex;
    gap: 10px;
}

.btn {
    padding: 13px 20px;
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 12px;
    transition: all 0.2s;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn:hover {
    border-color: var(--glass-border-hover);
    background: var(--glass);
}

.btn.primary {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
}

.btn.primary:hover {
    background: var(--text-2);
    border-color: var(--text-2);
}

/* TOAST */
.toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--glass);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border-hover);
    border-radius: 12px;
    padding: 12px 22px;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    z-index: 2000;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
}

.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { border-color: #c25a6a; color: #c25a6a; }

/* LOADING */
.loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--text-3);
    font-size: 12px;
    letter-spacing: 1px;
    gap: 10px;
}

.spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--glass-border);
    border-top-color: var(--text-2);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 700px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .sidebar.mobile-open {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 100;
        width: 100%;
    }
    .msg-bubble { max-width: 85%; }
    .mobile-menu-btn { display: flex !important; }
}

.mobile-menu-btn { display: none; }
</style>
</head>
<body data-theme="dark">

<!-- ЭКРАН ВХОДА -->
<div class="login-screen" id="login-screen">
    <div class="login-card">
        <div class="login-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
        </div>
        <div class="login-title">Messenger</div>
        <div class="login-sub">Введи имя чтобы начать</div>
        <input type="text" class="login-input" id="login-name" placeholder="Твоё имя" maxlength="20" autocomplete="off">
        <button class="login-btn" id="login-btn" onclick="login()">ВОЙТИ</button>
        <div class="login-error" id="login-error"></div>
    </div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
<div class="app" id="app" style="display: none;">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">Chat<span>App</span></div>
            <div class="sidebar-actions">
                <button class="icon-btn" onclick="toggleTheme()" title="Тема">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                    </svg>
                </button>
                <button class="icon-btn" onclick="openCreateRoom()" title="Создать комнату">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="user-info">
            <div class="user-avatar" id="my-avatar">?</div>
            <div class="user-info-text">
                <div class="user-info-name" id="my-name">Гость</div>
                <div class="user-info-status"><span class="status-dot"></span> В сети</div>
            </div>
        </div>

        <div class="rooms-header">Комнаты</div>
        <div class="rooms-list" id="rooms-list"></div>
    </aside>

    <!-- CHAT -->
    <main class="chat-area">
        <div class="chat-header" id="chat-header">
            <div class="chat-header-info">
                <div class="chat-header-avatar" id="chat-avatar">#</div>
                <div class="chat-header-text">
                    <div class="chat-header-name" id="chat-name">Общий чат</div>
                    <div class="chat-header-sub" id="chat-sub">Загрузка...</div>
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <textarea class="chat-input" id="chat-input" placeholder="Написать сообщение..." rows="1"></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>

</div>

<!-- МОДАЛКА СОЗДАНИЯ КОМНАТЫ -->
<div class="modal-overlay" id="modal-room">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">Новая комната</div>
            <button class="modal-close" onclick="closeModal('modal-room')">✕</button>
        </div>
        <div class="modal-body">
            <div class="field">
                <label>Название</label>
                <input type="text" id="room-name" placeholder="Например: Друзья" maxlength="30">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal('modal-room')">Отмена</button>
            <button class="btn primary" onclick="createRoom()">Создать</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
// ==================== FIREBASE CONFIG ====================
var firebaseConfig = {
    apiKey: "AIzaSyB-n2wL94hvryB-56V9Mydna57qWJTaUDE",
    authDomain: "ssss-b2af1.firebaseapp.com",
    databaseURL: "https://ssss-b2af1-default-rtdb.firebaseio.com",
    projectId: "ssss-b2af1",
    storageBucket: "ssss-b2af1.firebasestorage.app",
    messagingSenderId: "992229397721",
    appId: "1:992229397721:web:7850439a92db4faa341ac8"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

// ==================== СОСТОЯНИЕ ====================
var currentUser = null;
var currentRoom = 'general';
var rooms = [];
var roomsRef = null;
var messagesRef = null;
var messagesListener = null;
var roomsListener = null;
var toastTimer = null;

// ==================== STORAGE ====================
var Storage = {
    get: function(key, fallback) {
        try {
            var v = localStorage.getItem(key);
            return v !== null ? v : fallback;
        } catch (e) { return fallback; }
    },
    set: function(key, value) {
        try { localStorage.setItem(key, value); return true; }
        catch (e) { return false; }
    },
    remove: function(key) {
        try { localStorage.removeItem(key); } catch (e) {}
    }
};

// ==================== ТЕМА ====================
function toggleTheme() {
    var current = document.body.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    Storage.set('msgr_theme', next);
}

// ==================== TOAST ====================
function showToast(msg, type) {
    var toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.className = 'toast show' + (type === 'error' ? ' error' : '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.className = 'toast'; }, 2500);
}

// ==================== ВХОД ====================
function login() {
    var name = document.getElementById('login-name').value.trim();
    var errorEl = document.getElementById('login-error');
    var btn = document.getElementById('login-btn');

    if (!name || name.length < 2) {
        errorEl.textContent = 'Имя минимум 2 символа';
        return;
    }

    if (name.length > 20) {
        errorEl.textContent = 'Имя максимум 20 символов';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'ВХОД...';
    errorEl.textContent = '';

    currentUser = name;
    Storage.set('msgr_user', name);

    // Проверяем базу — пишем пользователя
    db.ref('users/' + sanitizeKey(name)).set({
        name: name,
        lastSeen: Date.now(),
        online: true
    }).then(function() {
        enterApp();
    }).catch(function(e) {
        console.error('Login error:', e);
        errorEl.textContent = 'Ошибка подключения к базе';
        btn.disabled = false;
        btn.textContent = 'ВОЙТИ';
    });
}

function sanitizeKey(key) {
    return String(key).replace(/[.#$\/\[\]]/g, '_');
}

function enterApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'grid';

    document.getElementById('my-name').textContent = currentUser;
    document.getElementById('my-avatar').textContent = currentUser.charAt(0).toUpperCase();

    // Создаём общий чат если нет
    db.ref('rooms/general').once('value').then(function(snapshot) {
        if (!snapshot.exists()) {
            db.ref('rooms/general').set({
                name: 'Общий чат',
                created: Date.now(),
                createdBy: 'system'
            });
        }
    });

    loadRooms();
    loadMessages('general');
    setupInputHandlers();
    updateOnlineStatus();
}

function updateOnlineStatus() {
    if (!currentUser) return;
    var userRef = db.ref('users/' + sanitizeKey(currentUser));
    userRef.update({ online: true, lastSeen: Date.now() });

    // При закрытии — оффлайн
    window.addEventListener('beforeunload', function() {
        userRef.update({ online: false, lastSeen: Date.now() });
    });

    // Обновляем lastSeen каждые 30 сек
    setInterval(function() {
        userRef.update({ online: true, lastSeen: Date.now() });
    }, 30000);
}

// ==================== КОМНАТЫ ====================
function loadRooms() {
    if (roomsListener) {
        roomsRef.off('value', roomsListener);
    }

    roomsRef = db.ref('rooms');
    roomsListener = roomsRef.on('value', function(snapshot) {
        rooms = [];
        snapshot.forEach(function(child) {
            rooms.push({
                id: child.key,
                name: child.val().name || child.key,
                created: child.val().created || 0
            });
        });

        // Сортируем: general первая, остальные по дате
        rooms.sort(function(a, b) {
            if (a.id === 'general') return -1;
            if (b.id === 'general') return 1;
            return (a.created || 0) - (b.created || 0);
        });

        renderRooms();
    });
}

function renderRooms() {
    var list = document.getElementById('rooms-list');
    if (!list) return;

    var html = '';
    for (var i = 0; i < rooms.length; i++) {
        var r = rooms[i];
        var isActive = r.id === currentRoom;
        var initial = r.name.charAt(0).toUpperCase();

        html += '<button class="room-item' + (isActive ? ' active' : '') + '" onclick="selectRoom(\'' + escapeAttr(r.id) + '\')">' +
            '<div class="room-item-icon">' + escapeHtml(initial) + '</div>' +
            '<div class="room-item-info">' +
                '<div class="room-item-name">' + escapeHtml(r.name) + '</div>' +
            '</div>' +
        '</button>';
    }
    list.innerHTML = html;
}

function selectRoom(roomId) {
    if (roomId === currentRoom) return;
    currentRoom = roomId;

    // Обновляем UI
    renderRooms();

    // Находим комнату
    var room = null;
    for (var i = 0; i < rooms.length; i++) {
        if (rooms[i].id === roomId) { room = rooms[i]; break; }
    }

    if (room) {
        document.getElementById('chat-name').textContent = room.name;
        document.getElementById('chat-avatar').textContent = room.name.charAt(0).toUpperCase();
    }

    loadMessages(roomId);
}

function openCreateRoom() {
    document.getElementById('room-name').value = '';
    document.getElementById('modal-room').classList.add('active');
    setTimeout(function() {
        document.getElementById('room-name').focus();
    }, 100);
}

function createRoom() {
    var name = document.getElementById('room-name').value.trim();
    if (!name || name.length < 2) {
        showToast('Название минимум 2 символа', 'error');
        return;
    }

    if (name.length > 30) {
        showToast('Название максимум 30 символов', 'error');
        return;
    }

    var roomId = sanitizeKey(name.toLowerCase()) + '_' + Date.now();

    db.ref('rooms/' + roomId).set({
        name: name,
        created: Date.now(),
        createdBy: currentUser
    }).then(function() {
        closeModal('modal-room');
        showToast('Комната создана');
        selectRoom(roomId);
    }).catch(function(e) {
        console.error('Create room error:', e);
        showToast('Ошибка создания', 'error');
    });
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

// ==================== СООБЩЕНИЯ ====================
function loadMessages(roomId) {
    // Отписываемся от старой комнаты
    if (messagesListener && messagesRef) {
        messagesRef.off('value', messagesListener);
    }

    messagesRef = db.ref('messages/' + roomId);
    var container = document.getElementById('chat-messages');
    container.innerHTML = '<div class="loading"><div class="spinner"></div><div>Загрузка сообщений...</div></div>';

    messagesListener = messagesRef.limitToLast(100).on('value', function(snapshot) {
        var messages = [];
        snapshot.forEach(function(child) {
            var val = child.val();
            messages.push({
                id: child.key,
                author: val.author || 'Аноним',
                text: val.text || '',
                time: val.time || 0
            });
        });

        renderMessages(messages);
    });

    // Обновляем подпись комнаты
    db.ref('rooms/' + roomId).once('value').then(function(snap) {
        if (snap.exists()) {
            var data = snap.val();
            document.getElementById('chat-name').textContent = data.name || roomId;
            document.getElementById('chat-avatar').textContent = (data.name || roomId).charAt(0).toUpperCase();
        }
        var room = rooms.find(function(r) { return r.id === roomId; });
        if (room) {
            document.getElementById('chat-sub').textContent = 'Общий чат';
        }
    });

    // Считаем пользователей онлайн
    db.ref('users').on('value', function(snap) {
        var online = 0;
        snap.forEach(function(child) {
            if (child.val().online) online++;
        });
        document.getElementById('chat-sub').textContent = online + ' онлайн';
    });
}

function renderMessages(messages) {
    var container = document.getElementById('chat-messages');
    if (!container) return;

    if (messages.length === 0) {
        container.innerHTML =
            '<div class="empty-chat">' +
                '<div class="empty-chat-icon">💬</div>' +
                '<div>Пока сообщений нет. Будь первым!</div>' +
            '</div>';
        return;
    }

    var html = '';
    for (var i = 0; i < messages.length; i++) {
        var m = messages[i];
        var isMine = m.author === currentUser;
        var initial = m.author.charAt(0).toUpperCase();
        var time = formatTime(m.time);

        html += '<div class="message' + (isMine ? ' mine' : '') + '">' +
            '<div class="msg-avatar">' + escapeHtml(initial) + '</div>' +
            '<div class="msg-bubble">' +
                (isMine ? '' : '<div class="msg-author">' + escapeHtml(m.author) + '</div>') +
                '<div class="msg-text">' + escapeHtml(m.text) + '</div>' +
                '<div class="msg-time">' + time + '</div>' +
            '</div>' +
        '</div>';
    }

    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
}

function sendMessage() {
    var input = document.getElementById('chat-input');
    var text = input.value.trim();
    if (!text || !currentUser) return;

    var sendBtn = document.getElementById('send-btn');
    sendBtn.disabled = true;

    db.ref('messages/' + currentRoom).push({
        author: currentUser,
        text: text,
        time: Date.now()
    }).then(function() {
        input.value = '';
        input.style.height = 'auto';
        sendBtn.disabled = false;
        input.focus();
    }).catch(function(e) {
        console.error('Send error:', e);
        showToast('Ошибка отправки', 'error');
        sendBtn.disabled = false;
    });
}

// ==================== INPUT HANDLERS ====================
function setupInputHandlers() {
    var input = document.getElementById('chat-input');
    if (!input) return;

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    input.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // Enter на логине
    document.getElementById('login-name').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') login();
    });

    // Enter на создании комнаты
    document.getElementById('room-name').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') createRoom();
    });
}

// ==================== UTILS ====================
function formatTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var now = new Date();
    var diff = now - d;

    if (diff < 60000) return 'только что';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' мин';

    var h = d.getHours().toString().padStart(2, '0');
    var m = d.getMinutes().toString().padStart(2, '0');
    return h + ':' + m;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
}

function escapeAttr(str) {
    return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
function init() {
    var savedTheme = Storage.get('msgr_theme', 'dark');
    document.body.setAttribute('data-theme', savedTheme);

    var savedUser = Storage.get('msgr_user', '');
    if (savedUser) {
        document.getElementById('login-name').value = savedUser;
    }

    console.log('%cMessenger готов', 'font-size: 18px; color: #4a7cff; font-weight: bold;');
}

init();
</script>
</body>
</html>

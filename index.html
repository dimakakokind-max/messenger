<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root, [data-theme="dark"] {
    --bg: #08080a;
    --bg-2: #0c0c10;
    --bg-3: #101014;
    --glass: rgba(22, 22, 28, 0.55);
    --glass-2: rgba(30, 30, 38, 0.45);
    --glass-3: rgba(40, 40, 50, 0.35);
    --glass-border: rgba(255, 255, 255, 0.06);
    --glass-border-hover: rgba(255, 255, 255, 0.14);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --text: #e8e8ee;
    --text-2: #a8a8b4;
    --text-3: #6a6a78;
    --text-4: #3a3a48;
    --divider: rgba(255, 255, 255, 0.05);
    --hover: rgba(255, 255, 255, 0.04);
    --input-bg: rgba(0, 0, 0, 0.3);
    --my-msg: rgba(74, 124, 255, 0.15);
    --my-msg-border: rgba(74, 124, 255, 0.3);
    --gold: #d4b96a;
    --danger: #e74c6f;
    --frozen: #5a9ec2;
}

[data-theme="light"] {
    --bg: #f5f5f7;
    --bg-2: #ececef;
    --bg-3: #e5e5ea;
    --glass: rgba(255, 255, 255, 0.7);
    --glass-2: rgba(255, 255, 255, 0.55);
    --glass-3: rgba(255, 255, 255, 0.4);
    --glass-border: rgba(0, 0, 0, 0.06);
    --glass-border-hover: rgba(0, 0, 0, 0.12);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    --text: #1a1a20;
    --text-2: #55555f;
    --text-3: #8a8a94;
    --text-4: #b8b8c0;
    --divider: rgba(0, 0, 0, 0.05);
    --hover: rgba(0, 0, 0, 0.03);
    --input-bg: rgba(0, 0, 0, 0.03);
    --my-msg: rgba(74, 124, 255, 0.1);
    --my-msg-border: rgba(74, 124, 255, 0.25);
    --gold: #a8873a;
    --danger: #c25a6a;
    --frozen: #3a7a9e;
}

* { transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease; }

html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    overflow: hidden;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
}

body::before {
    content: '';
    position: fixed;
    top: -20%; left: -10%;
    width: 60%; height: 60%;
    background: radial-gradient(circle, var(--glass-border) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
}

/* ==================== AUTH ==================== */
.auth-screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 1000;
    padding: 20px;
}

.auth-card {
    background: var(--glass);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border-hover);
    border-radius: 24px;
    padding: 36px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    text-align: center;
    position: relative;
    overflow: hidden;
}

.auth-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-border-hover), transparent);
}

.auth-icon {
    width: 68px;
    height: 68px;
    background: linear-gradient(135deg, #4a7cff, #6a5acd);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    color: #fff;
    box-shadow: 0 8px 24px rgba(74, 124, 255, 0.3);
}

.auth-icon svg { width: 32px; height: 32px; }

.auth-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: -0.02em;
}

.auth-sub {
    font-size: 13px;
    color: var(--text-3);
    margin-bottom: 24px;
}

.auth-field {
    margin-bottom: 12px;
    text-align: left;
}

.auth-field label {
    display: block;
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 500;
}

.auth-input {
    width: 100%;
    padding: 13px 16px;
    background: var(--input-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
}

.auth-input:focus {
    border-color: var(--glass-border-hover);
    background: var(--glass-2);
}

.auth-input::placeholder { color: var(--text-4); }

.auth-btn {
    width: 100%;
    padding: 14px;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
}

.auth-btn:hover { transform: scale(1.02); opacity: 0.9; }
.auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.auth-switch {
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-3);
}

.auth-switch a {
    color: var(--text);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
}

.auth-error {
    color: var(--danger);
    font-size: 12px;
    margin-top: 10px;
    min-height: 16px;
}

/* ==================== APP ==================== */
.app {
    display: grid;
    grid-template-columns: 300px 1fr;
    height: 100vh;
    position: relative;
    z-index: 1;
}

.sidebar {
    background: var(--glass);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-right: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.sidebar-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.sidebar-logo {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text);
    text-transform: uppercase;
}

.sidebar-logo span { color: var(--text-3); font-weight: 400; }

.sidebar-actions { display: flex; gap: 6px; }

.icon-btn {
    width: 32px;
    height: 32px;
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

.icon-btn:hover { border-color: var(--glass-border-hover); color: var(--text); }
.icon-btn svg { width: 14px; height: 14px; }

.user-info {
    padding: 14px 20px;
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: background 0.15s;
}

.user-info:hover { background: var(--hover); }

.user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4a7cff, #6a5acd);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    position: relative;
}

.user-avatar.owner {
    background: linear-gradient(135deg, var(--gold), #8a6d2a);
    box-shadow: 0 0 15px rgba(212, 185, 106, 0.5);
}

.user-avatar.moderator {
    background: linear-gradient(135deg, #4ade80, #16a34a);
    box-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
}

.user-avatar-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    border: 2px solid var(--bg);
}

.user-info-text { min-width: 0; flex: 1; }

.user-info-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 6px;
}

.user-info-name .role-icon { font-size: 12px; }

.user-info-status {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 4px;
}

.status-dot {
    width: 6px;
    height: 6px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 8px #4ade80;
}

.rooms-header {
    padding: 16px 20px 8px;
    font-size: 10px;
    color: var(--text-4);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 600;
}

.rooms-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px 16px;
}

.room-item {
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
    margin-bottom: 2px;
    border: none;
    background: none;
    font-family: inherit;
    width: 100%;
    text-align: left;
}

.room-item:hover { background: var(--hover); color: var(--text); }
.room-item.active { background: var(--glass-2); color: var(--text); }

.room-item-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--glass-3), var(--glass-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    flex-shrink: 0;
}

.room-item-info { min-width: 0; flex: 1; }

.room-item-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ==================== CHAT ==================== */
.chat-area {
    display: flex;
    flex-direction: column;
    background: var(--glass);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    overflow: hidden;
}

.chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
}

.chat-header-info {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.chat-header-avatar {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #4a7cff, #6a5acd);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    flex-shrink: 0;
}

.chat-header-text { min-width: 0; }

.chat-header-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.chat-header-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 3px; }

.message {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
    animation: msgIn 0.3s ease;
}

@keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.mine { flex-direction: row-reverse; }

.msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--glass-3), var(--glass-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    flex-shrink: 0;
    border: 1px solid var(--glass-border);
    position: relative;
}

.msg-avatar.owner {
    background: linear-gradient(135deg, var(--gold), #8a6d2a);
    color: #fff;
    border-color: var(--gold);
}

.msg-avatar.moderator {
    background: linear-gradient(135deg, #4ade80, #16a34a);
    color: #fff;
    border-color: #4ade80;
}

.message.mine .msg-avatar {
    background: linear-gradient(135deg, #4a7cff, #6a5acd);
    color: #fff;
    border-color: transparent;
}

.msg-bubble {
    max-width: 65%;
    padding: 10px 14px;
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    word-wrap: break-word;
}

.message.mine .msg-bubble {
    background: var(--my-msg);
    border-color: var(--my-msg-border);
}

.msg-author {
    font-size: 11px;
    font-weight: 700;
    color: #4a7cff;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.msg-author.owner { color: var(--gold); }
.msg-author.moderator { color: #4ade80; }

.message.mine .msg-author { text-align: right; color: #6a5acd; }

.msg-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
}

.msg-time {
    font-size: 10px;
    color: var(--text-4);
    margin-top: 4px;
    text-align: right;
}

.chat-input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--glass-border);
    flex-shrink: 0;
}

.chat-input-wrapper {
    display: flex;
    gap: 10px;
    align-items: flex-end;
}

.chat-input {
    flex: 1;
    padding: 13px 18px;
    background: var(--input-bg);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
    resize: none;
    min-height: 46px;
    max-height: 120px;
    line-height: 1.5;
}

.chat-input:focus {
    border-color: var(--glass-border-hover);
    background: var(--glass-2);
}

.chat-input::placeholder { color: var(--text-4); }

.send-btn {
    width: 46px;
    height: 46px;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
}

.send-btn:hover { transform: scale(1.05); }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.send-btn svg { width: 20px; height: 20px; }

.empty-chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-3);
    text-align: center;
    gap: 12px;
    padding: 40px;
}

.empty-chat-icon { font-size: 48px; opacity: 0.3; margin-bottom: 8px; }

/* FROZEN BANNER */
.frozen-banner {
    padding: 12px 24px;
    background: rgba(90, 158, 194, 0.15);
    border-top: 1px solid var(--frozen);
    color: var(--frozen);
    font-size: 13px;
    text-align: center;
    font-weight: 600;
    display: none;
}

.frozen-banner.active { display: block; }

/* ==================== MODAL / SETTINGS ==================== */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
}

.modal-overlay.active { display: flex; }

.modal {
    background: var(--glass);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid var(--glass-border-hover);
    border-radius: 20px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    animation: slideUp 0.3s ease;
    position: relative;
    overflow: hidden;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
}

.modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-border-hover), transparent);
    z-index: 1;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.modal-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--divider);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-title { font-size: 16px; font-weight: 700; color: var(--text); }

.modal-close {
    width: 30px;
    height: 30px;
    background: transparent;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.modal-close:hover { background: var(--hover); color: var(--text); }

.modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }

.field { margin-bottom: 14px; }

.field label {
    display: block;
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 7px;
    font-weight: 500;
}

.field input {
    width: 100%;
    padding: 13px 15px;
    background: var(--input-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
}

.field input:focus {
    border-color: var(--glass-border-hover);
    background: var(--glass-2);
}

.field input::placeholder { color: var(--text-4); }

.modal-footer {
    padding: 14px 24px 20px;
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--divider);
}

.btn {
    padding: 13px 20px;
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 12px;
    transition: all 0.2s;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn:hover { border-color: var(--glass-border-hover); background: var(--glass); }

.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.primary:hover { background: var(--text-2); border-color: var(--text-2); }

.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); background: rgba(231, 76, 111, 0.1); }

/* SETTINGS */
.settings-profile {
    text-align: center;
    margin-bottom: 22px;
}

.settings-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4a7cff, #6a5acd);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    margin: 0 auto 14px;
    box-shadow: 0 8px 24px rgba(74, 124, 255, 0.3);
}

.settings-avatar.owner {
    background: linear-gradient(135deg, var(--gold), #8a6d2a);
    box-shadow: 0 0 25px rgba(212, 185, 106, 0.5);
}

.settings-avatar.moderator {
    background: linear-gradient(135deg, #4ade80, #16a34a);
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
}

.settings-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
}

.settings-role {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.settings-role.owner {
    background: rgba(212, 185, 106, 0.15);
    color: var(--gold);
    border: 1px solid var(--gold);
}

.settings-role.moderator {
    background: rgba(74, 222, 128, 0.15);
    color: #4ade80;
    border: 1px solid #4ade80;
}

.settings-role.user {
    background: var(--glass-2);
    color: var(--text-3);
    border: 1px solid var(--glass-border);
}

.settings-section {
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--divider);
}

.settings-section:last-child { border-bottom: none; padding-bottom: 0; }

.settings-section-title {
    font-size: 10px;
    color: var(--text-4);
    letter-spacing: 2px;
    text-transform: uppercase;

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
// ==================== FIREBASE ====================
var firebaseConfig = {
    apiKey: "AIzaSyB-n2wL94hvryB-56V9Mydna57qWJTaUDE",
    authDomain: "ssss-b2af1.firebaseapp.com",
    databaseURL: "https://ssss-b2af1-default-rtdb.firebaseio.com",
    projectId: "ssss-b2af1",
    storageBucket: "ssss-b2af1.firebasestorage.app",
    messagingSenderId: "992229397721",
    appId: "1:992229397721:web:7850439a92db4faa341ac8"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();

// ==================== КОНСТАНТЫ ====================
var OWNER_PROMO = 'OWNER-1337-FOREVER';

// ==================== СОСТОЯНИЕ ====================
var currentUser = null;
var currentRoom = 'general';
var rooms = [];
var allUsers = {};
var myRole = 'user';
var isFrozen = false;
var authMode = 'login';
var roomsListener = null;
var messagesListener = null;
var usersListener = null;
var bansListener = null;
var rolesListener = null;
var toastTimer = null;

// ==================== STORAGE ====================
var Storage = {
    get: function(key, fallback) {
        try {
            var v = localStorage.getItem(key);
            return v !== null ? v : fallback;
        } catch (e) { return fallback; }
    },
    set: function(key, value) {
        try { localStorage.setItem(key, value); return true; }
        catch (e) { return false; }
    },
    remove: function(key) {
        try { localStorage.removeItem(key); } catch (e) {}
    }
};

// ==================== ХЕШИРОВАНИЕ ПАРОЛЯ ====================
function hashPassword(password) {
    var hash = 0;
    var str = 'salt_' + password + '_1337';
    for (var i = 0; i < str.length; i++) {
        var char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
    }
    return 'h' + Math.abs(hash).toString(36);
}

// ==================== ТЕМА ====================
function toggleTheme() {
    var current = document.body.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    Storage.set('msgr_theme', next);
}

// ==================== TOAST ====================
function showToast(msg, type) {
    var toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.className = 'toast show' + (type ? ' ' + type : '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.className = 'toast'; }, 2500);
}

// ==================== АВТОРИЗАЦИЯ ====================
function switchAuthMode() {
    authMode = authMode === 'login' ? 'register' : 'login';
    updateAuthUI();
}

function updateAuthUI() {
    var title = document.getElementById('auth-title');
    var sub = document.getElementById('auth-sub');
    var btn = document.getElementById('auth-btn');
    var switchEl = document.getElementById('auth-switch');

    if (authMode === 'login') {
        title.textContent = 'Вход';
        sub.textContent = 'Введи логин и пароль';
        btn.textContent = 'ВОЙТИ';
        switchEl.innerHTML = 'Нет аккаунта? <a onclick="switchAuthMode()">Зарегистрироваться</a>';
    } else {
        title.textContent = 'Регистрация';
        sub.textContent = 'Придумай логин и пароль';
        btn.textContent = 'СОЗДАТЬ АККАУНТ';
        switchEl.innerHTML = 'Уже есть аккаунт? <a onclick="switchAuthMode()">Войти</a>';
    }
    document.getElementById('auth-error').textContent = '';
}

function submitAuth() {
    var login = document.getElementById('auth-login').value.trim().toLowerCase();
    var password = document.getElementById('auth-password').value;
    var errorEl = document.getElementById('auth-error');
    var btn = document.getElementById('auth-btn');
    errorEl.textContent = '';

    if (!login || !password) { errorEl.textContent = 'Заполни все поля'; return; }
    if (login.length < 3) { errorEl.textContent = 'Логин минимум 3 символа'; return; }
    if (login.length > 20) { errorEl.textContent = 'Логин максимум 20 символов'; return; }
    if (!/^[a-z0-9_]+$/.test(login)) { errorEl.textContent = 'Логин: только a-z, 0-9, _'; return; }
    if (password.length < 4) { errorEl.textContent = 'Пароль минимум 4 символа'; return; }

    btn.disabled = true;
    btn.textContent = 'ПРОВЕРКА...';

    var userRef = db.ref('accounts/' + login);

    userRef.once('value').then(function(snapshot) {
        var exists = snapshot.exists();

        if (authMode === 'register') {
            if (exists) {
                errorEl.textContent = 'Логин уже занят';
                btn.disabled = false;
                btn.textContent = 'СОЗДАТЬ АККАУНТ';
                return;
            }

            return userRef.set({
                login: login,
                password: hashPassword(password),
                created: Date.now(),
                lastSeen: Date.now(),
                online: true,
                role: 'user'
            }).then(function() {
                currentUser = login;
                Storage.set('msgr_user', login);
                Storage.set('msgr_pass', hashPassword(password));
                enterApp();
            });
        } else {
            if (!exists) {
                errorEl.textContent = 'Аккаунт не найден';
                btn.disabled = false;
                btn.textContent = 'ВОЙТИ';
                return;
            }

            var data = snapshot.val();
            if (data.password !== hashPassword(password)) {
                errorEl.textContent = 'Неверный пароль';
                btn.disabled = false;
                btn.textContent = 'ВОЙТИ';
                return;
            }

            // Проверка бана
            return db.ref('bans/' + login).once('value').then(function(banSnap) {
                if (banSnap.exists()) {
                    var ban = banSnap.val();
                    errorEl.textContent = '🚫 Вы забанены. Причина: ' + (ban.reason || 'не указана');
                    btn.disabled = false;
                    btn.textContent = 'ВОЙТИ';
                    return;
                }

                currentUser = login;
                Storage.set('msgr_user', login);
                Storage.set('msgr_pass', hashPassword(password));

                return userRef.update({ online: true, lastSeen: Date.now() }).then(function() {
                    enterApp();
                });
            });
        }
    }).catch(function(e) {
        console.error('Auth error:', e);
        errorEl.textContent = 'Ошибка подключения';
        btn.disabled = false;
        btn.textContent = authMode === 'login' ? 'ВОЙТИ' : 'СОЗДАТЬ АККАУНТ';
    });
}

function enterApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app').style.display = 'grid';

    document.getElementById('my-name').textContent = currentUser;
    document.getElementById('my-avatar').textContent = currentUser.charAt(0).toUpperCase();

    // Создаём general комнату
    db.ref('rooms/general').once('value').then(function(snap) {
        if (!snap.exists()) {
            db.ref('rooms/general').set({
                name: 'Общий чат',
                created: Date.now()
            });
        }
    });

    loadMyRole();
    loadMyBanStatus();
    loadRooms();
    loadMessages('general');
    loadAllUsers();
    setupInputHandlers();

    // Обновляем онлайн
    var userRef = db.ref('accounts/' + currentUser);
    userRef.update({ online: true, lastSeen: Date.now() });

    window.addEventListener('beforeunload', function() {
        userRef.update({ online: false, lastSeen: Date.now() });
    });

    setInterval(function() {
        userRef.update({ online: true, lastSeen: Date.now() });
    }, 30000);

    console.log('%cMessenger готов', 'font-size: 18px; color: #4a7cff; font-weight: bold;');
    console.log('%cПромокод OWNER: OWNER-1337-FOREVER', 'font-size: 14px; color: #d4b96a; font-weight: bold;');
}

function logout() {
    if (currentUser) {
        db.ref('accounts/' + currentUser).update({ online: false, lastSeen: Date.now() });
    }
    currentUser = null;
    Storage.remove('msgr_user');
    Storage.remove('msgr_pass');

    if (roomsListener) db.ref('rooms').off('value', roomsListener);
    if (messagesListener) db.ref('messages/' + currentRoom).off('value', messagesListener);
    if (usersListener) db.ref('accounts').off('value', usersListener);

    document.getElementById('auth-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth-login').value = '';
    document.getElementById('auth-password').value = '';
    closeModal('modal-settings');
    closeModal('modal-admin');
    showToast('Вы вышли');
}

// ==================== РОЛЬ И БАН ====================
function loadMyRole() {
    db.ref('roles/' + currentUser).on('value', function(snap) {
        myRole = snap.exists() ? snap.val() : 'user';
        updateMyRoleUI();
    });
}

function loadMyBanStatus() {
    db.ref('bans/' + currentUser).on('value', function(snap) {
        if (snap.exists()) {
            isFrozen = true;
            document.getElementById('frozen-banner').classList.add('active');
            document.getElementById('chat-input-area').style.display = 'none';
        } else {
            isFrozen = false;
            document.getElementById('frozen-banner').classList.remove('active');
            document.getElementById('chat-input-area').style.display = 'block';
        }
    });
}

function updateMyRoleUI() {
    var avatar = document.getElementById('my-avatar');
    var nameEl = document.getElementById('my-name');

    avatar.className = 'user-avatar';
    var icon = '';

    if (myRole === 'owner') {
        avatar.classList.add('owner');
        icon = '👑';
    } else if (myRole === 'moderator') {
        avatar.classList.add('moderator');
        icon = '⭐';
    }

    nameEl.innerHTML = escapeHtml(currentUser) + (icon ? ' <span class="role-icon">' + icon + '</span>' : '');
}

// ==================== ПОЛЬЗОВАТЕЛИ ====================
function loadAllUsers() {
    usersListener = db.ref('accounts').on('value', function(snap) {
        allUsers = {};
        snap.forEach(function(child) {
            allUsers[child.key] = child.val();
        });
    });
}

// ==================== КОМНАТЫ ====================
function loadRooms() {
    if (roomsListener) db.ref('rooms').off('value', roomsListener);

    roomsListener = db.ref('rooms').on('value', function(snapshot) {
        rooms = [];
        snapshot.forEach(function(child) {
            rooms.push({
                id: child.key,
                name: child.val().name || child.key,
                created: child.val().created || 0
            });
        });

        rooms.sort(function(a, b) {
            if (a.id === 'general') return -1;
            if (b.id === 'general') return 1;
            return (a.created || 0) - (b.created || 0);
        });

        renderRooms();
    });
}

function renderRooms() {
    var list = document.getElementById('rooms-list');
    if (!list) return;

    var html = '';
    for (var i = 0; i < rooms.length; i++) {
        var r = rooms[i];
        var isActive = r.id === currentRoom;

        html += '<button class="room-item' + (isActive ? ' active' : '') + '" onclick="selectRoom(\'' + escapeAttr(r.id) + '\')">' +
            '<div class="room-item-icon">' + escapeHtml(r.name.charAt(0).toUpperCase()) + '</div>' +
            '<div class="room-item-info">' +
                '<div class="room-item-name">' + escapeHtml(r.name) + '</div>' +
            '</div>' +
        '</button>';
    }
    list.innerHTML = html;
}

function selectRoom(roomId) {
    if (roomId === currentRoom) return;
    currentRoom = roomId;
    renderRooms();

    var room = null;
    for (var i = 0; i < rooms.length; i++) {
        if (rooms[i].id === roomId) { room = rooms[i]; break; }
    }
    if (room) {
        document.getElementById('chat-name').textContent = room.name;
        document.getElementById('chat-avatar').textContent = room.name.charAt(0).toUpperCase();
    }
    loadMessages(roomId);
}

function openCreateRoom() {
    document.getElementById('room-name').value = '';
    document.getElementById('modal-room').classList.add('active');
    setTimeout(function() {
        document.getElementById('room-name').focus();
    }, 100);
}

function createRoom() {
    var name = document.getElementById('room-name').value.trim();
    if (!name || name.length < 2) { showToast('Минимум 2 символа', 'error'); return; }
    if (name.length > 30) { showToast('Максимум 30 символов', 'error'); return; }

    var roomId = sanitizeKey(name.toLowerCase()) + '_' + Date.now();

    db.ref('rooms/' + roomId).set({
        name: name,
        created: Date.now(),
        createdBy: currentUser
    }).then(function() {
        closeModal('modal-room');
        showToast('Комната создана');
        selectRoom(roomId);
    }).catch(function(e) {
        showToast('Ошибка создания', 'error');
    });
}

// ==================== СООБЩЕНИЯ ====================
function loadMessages(roomId) {
    if (messagesListener) db.ref('messages/' + currentRoom).off('value', messagesListener);

    var container = document.getElementById('chat-messages');
    container.innerHTML = '<div class="loading"><div class="spinner"></div><div>Загрузка...</div></div>';

    messagesListener = db.ref('messages/' + roomId).limitToLast(100).on('value', function(snapshot) {
        var messages = [];
        snapshot.forEach(function(child) {
            var val = child.val();
            messages.push({
                id: child.key,
                author: val.author || 'Аноним',
                text: val.text || '',
                time: val.time || 0
            });
        });
        renderMessages(messages);
    });

    db.ref('accounts').on('value', function(snap) {
        var online = 0;
        snap.forEach(function(child) {
            if (child.val().online) online++;
        });
        document.getElementById('chat-sub').textContent = online + ' онлайн';
    });
}

function renderMessages(messages) {
    var container = document.getElementById('chat-messages');
    if (!container) return;

    if (messages.length === 0) {
        container.innerHTML = '<div class="empty-chat"><div class="empty-chat-icon">💬</div><div>Пока сообщений нет</div></div>';
        return;
    }

    var html = '';
    for (var i = 0; i < messages.length; i++) {
        var m = messages[i];
        var isMine = m.author === currentUser;
        var authorRole = (m.author === currentUser) ? myRole : (allUsers[m.author] ? allUsers[m.author].role : 'user');
        var initial = m.author.charAt(0).toUpperCase();
        var avatarClass = 'msg-avatar';
        var authorClass = 'msg-author';
        var roleIcon = '';

        if (authorRole === 'owner') {
            avatarClass += ' owner';
            authorClass += ' owner';
            roleIcon = ' 👑';
        } else if (authorRole === 'moderator') {
            avatarClass += ' moderator';
            authorClass += ' moderator';
            roleIcon = ' ⭐';
        }

        html += '<div class="message' + (isMine ? ' mine' : '') + '">' +
            '<div class="' + avatarClass + '">' + escapeHtml(initial) + '</div>' +
            '<div class="msg-bubble">' +
                (isMine ? '' : '<div class="' + authorClass + '">' + escapeHtml(m.author) + roleIcon + '</div>') +
                '<div class="msg-text">' + escapeHtml(m.text) + '</div>' +
                '<div class="msg-time">' + formatTime(m.time) + '</div>' +
            '</div>' +
        '</div>';
    }
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
}

function sendMessage() {
    var input = document.getElementById('chat-input');
    var text = input.value.trim();
    if (!text || !currentUser) return;

    if (isFrozen) {
        showToast('Вы заморожены', 'error');
        return;
    }

    var sendBtn = document.getElementById('send-btn');
    sendBtn.disabled = true;

    db.ref('messages/' + currentRoom).push({
        author: currentUser,
        text: text,
        time: Date.now()
    }).then(function() {
        input.value = '';
        input.style.height = 'auto';
        sendBtn.disabled = false;
        input.focus();
    }).catch(function(e) {
        showToast('Ошибка отправки', 'error');
        sendBtn.disabled = false;
    });
}

function setupInputHandlers() {
    var input = document.getElementById('chat-input');
    if (!input) return;

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    input.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    document.getElementById('auth-login').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('auth-password').focus();
    });

    document.getElementById('auth-password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') submitAuth();
    });

    document.getElementById('room-name').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') createRoom();
    });
}

// ==================== НАСТРОЙКИ ====================
function openSettings() {
    renderSettings();
    document.getElementById('modal-settings').classList.add('active');
}

function renderSettings() {
    var avatarClass = 'settings-avatar';
    var roleClass = 'settings-role';
    var roleText = 'ПОЛЬЗОВАТЕЛЬ';
    var roleIcon = '';

    if (myRole === 'owner') {
        avatarClass += ' owner';
        roleClass += ' owner';
        roleText = 'ОСНОВАТЕЛЬ';
        roleIcon = '👑';
    } else if (myRole === 'moderator') {
        avatarClass += ' moderator';
        roleClass += ' moderator';
        roleText = 'МОДЕРАТОР';
        roleIcon = '⭐';
    } else {
        roleClass += ' user';
    }

    var accountCreated = allUsers[currentUser] && allUsers[currentUser].created
        ? new Date(allUsers[currentUser].created).toLocaleDateString('ru-RU')
        : '—';

    var html =
        '<div class="settings-profile">' +
            '<div class="' + avatarClass + '">' + escapeHtml(currentUser.charAt(0).toUpperCase()) + '</div>' +
            '<div class="settings-name">' + escapeHtml(currentUser) + (roleIcon ? ' ' + roleIcon : '') + '</div>' +
            '<div class="' + roleClass + '">' + roleText + '</div>' +
        '</div>' +

        '<div class="settings-section">' +
            '<div class="settings-section-title">Аккаунт</div>' +
            '<div class="settings-row">' +
                '<span class="label">Логин</span>' +
                '<span class="value">' + escapeHtml(currentUser) + '</span>' +
            '</div>' +
            '<div class="settings-row">' +
                '<span class="label">Регистрация</span>' +
                '<span class="value">' + accountCreated + '</span>' +
            '</div>' +
        '</div>' +

        '<div class="settings-section">' +
            '<div class="settings-section-title">Промокод</div>' +
            '<div class="promo-input-row">' +
                '<input type="text" id="promo-input" placeholder="OWNER-XXXXX" autocomplete="off">' +
                '<button onclick="applyPromo()">OK</button>' +
            '</div>' +
            '<div class="promo-status" id="promo-status"></div>' +
        '</div>' +

        (myRole === 'owner' || myRole === 'moderator' ?
            '<div class="settings-section">' +
                '<div class="settings-section-title">Администрирование</div>' +
                '<button class="settings-btn" onclick="openAdminPanel()">🔨 Админ-панель</button>' +
            '</div>'
            : '') +

        '<div class="settings-section">' +
            '<div class="settings-section-title">Тема</div>' +
            '<button class="settings-btn" onclick="toggleTheme()">🌓 Переключить тему</button>' +
        '</div>';

    document.getElementById('settings-body').innerHTML = html;
}

function applyPromo() {
    var input = document.getElementById('promo-input');
    var status = document.getElementById('promo-status');
    var code = input.value.trim().toUpperCase();

    status.className = 'promo-status';
    status.textContent = '';

    if (!code) { status.className = 'promo-status error'; status.textContent = 'Введи промокод'; return; }

    if (code === OWNER_PROMO) {
        db.ref('roles/' + currentUser).set('owner').then(function() {
            status.className = 'promo-status success';
            status.textContent = '👑 OWNER активирован навсегда';
            showToast('OWNER активирован', 'gold');
            setTimeout(function() {
                renderSettings();
                loadMyRole();
            }, 500);
        });
        return;
    }

    status.className = 'promo-status error';
    status.textContent = 'Неверный промокод';
}

// ==================== АДМИН-ПАНЕЛЬ ====================
function openAdminPanel() {
    closeModal('modal-settings');
    renderAdminPanel();
    document.getElementById('modal-admin').classList.add('active');

    // Слушаем изменения
    if (bansListener) db.ref('bans').off('value', bansListener);
    if (rolesListener) db.ref('roles').off('value', rolesListener);

    bansListener = db.ref('bans').on('value', function() { renderAdminPanel(); });
    rolesListener = db.ref('roles').on('value', function() { renderAdminPanel(); });
}

function renderAdminPanel() {
    var body = document.getElementById('admin-body');
    if (!body) return;

    var userKeys = Object.keys(allUsers);
    if (userKeys.length === 0) {
        body.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
        return;
    }

    // Получаем баны и роли
    db.ref('bans').once('value').then(function(bansSnap) {
        var bans = bansSnap.val() || {};

        db.ref('roles').once('value').then(function(rolesSnap) {
            var roles = rolesSnap.val() || {};

            var html = '<div style="font-size: 11px; color: var(--text-3); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px;">Пользователи (' + userKeys.length + ')</div>';

            userKeys.sort();

            for (var i = 0; i < userKeys.length; i++) {
                var login = userKeys[i];
                var user = allUsers[login];
                var isBanned = !!bans[login];
                var role = roles[login] || 'user';

                var avatarClass = 'admin-user-avatar';
                var roleIcon = '';
                var roleLabel = 'Пользователь';

                if (role === 'owner') { avatarClass += ' owner'; roleIcon = '👑'; roleLabel = 'Основатель'; }
                else if (role === 'moderator') { avatarClass += ' moderator'; roleIcon = '⭐'; roleLabel = 'Модератор'; }

                if (isBanned) roleLabel += ' · 🚫 Забанен';

                var isMe = login === currentUser;
                var canModerate = (myRole === 'owner' || myRole === 'moderator') && !isMe && role !== 'owner';

                html += '<div class="admin-user">' +
                    '<div class="admin-user-header">' +
                        '<div class="' + avatarClass + '">' + escapeHtml(login.charAt(0).toUpperCase()) + '</div>' +
                        '<div class="admin-user-info">' +
                            '<div class="admin-user-name">' + escapeHtml(login) + (roleIcon ? ' ' + roleIcon : '') + (isMe ? ' (вы)' : '') + '</div>' +
                            '<div class="admin-user-meta">' + roleLabel + ' · ' + (user.online ? '🟢 в сети' : '⚫ не в сети') + '</div>' +
                        '</div>' +
                    '</div>';

                if (canModerate) {
                    html += '<div class="admin-actions">';

                    if (isBanned) {
                        html += '<button class="admin-btn" onclick="unbanUser(\'' + login + '\')">✅ Разбанить</button>';
                    } else {
                        html += '<button class="admin-btn danger" onclick="freezeUser(\'' + login + '\')">❄️ Заморозить</button>';
                        html += '<button class="admin-btn danger" onclick="banUser(\'' + login + '\')">🔨 Забанить</button>';
                    }

                    if (role !== 'moderator' && myRole === 'owner') {
                        html += '<button class="admin-btn mod" onclick="setRole(\'' + login + '\', \'moderator\')">⭐ Модератор</button>';
                    } else if (role === 'moderator' && myRole === 'owner') {
                        html += '<button class="admin-btn" onclick="setRole(\'' + login + '\', \'user\')">Снять модератора</button>';
                    }

                    html += '</div>';
                }

                html += '</div>';
            }

            body.innerHTML = html;
        });
    });
}

function banUser(login) {
    var reason = prompt('Причина бана для ' + login + ':', 'Нарушение правил');
    if (reason === null) return;

    db.ref('bans/' + login).set({
        reason: reason,
        by: currentUser,
        time: Date.now()
    }).then(function() {
        showToast('Пользователь ' + login + ' забанен', 'error');
        renderAdminPanel();
    });
}

function freezeUser(login) {
    var reason = prompt('Причина заморозки для ' + login + ':', 'Временное ограничение');
    if (reason === null) return;

    db.ref('bans/' + login).set({
        reason: reason,
        frozen: true,
        by: currentUser,
        time: Date.now()
    }).then(function() {
        showToast('Пользователь ' + login + ' заморожен');
        renderAdminPanel();
    });
}

function unbanUser(login) {
    if (!confirm('Разбанить ' + login + '?')) return;

    db.ref('bans/' + login).remove().then(function() {
        showToast('Пользователь ' + login + ' разбанен');
        renderAdminPanel();
    });
}

function setRole(login, role) {
    if (role === 'user') {
        if (!confirm('Снять модератора с ' + login + '?')) return;
        db.ref('roles/' + login).remove().then(function() {
            showToast('Роль снята');
            renderAdminPanel();
        });
    } else {
        if (!confirm('Выдать роль ' + role + ' для ' + login + '?')) return;
        db.ref('roles/' + login).set(role).then(function() {
            showToast('Роль выдана');
            renderAdminPanel();
        });
    }
}

// ==================== UTILS ====================
function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

function formatTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var now = new Date();
    var diff = now - d;
    if (diff < 60000) return 'только что';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' мин';
    var h = d.getHours().toString().padStart(2, '0');
    var m = d.getMinutes().toString().padStart(2, '0');
    return h + ':' + m;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
}

function escapeAttr(str) {
    return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function sanitizeKey(key) {
    return String(key).replace(/[.#$\/\[\]]/g, '_');
}

// Клик по оверлею
document.addEventListener('click', function(e) {
    if (e.target.classList && e.target.classList.contains('modal-overlay')) {
        e.target.classList.remove('active');
    }
});

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
function init() {
    var savedTheme = Storage.get('msgr_theme', 'dark');
    document.body.setAttribute('data-theme', savedTheme);

    var savedUser = Storage.get('msgr_user', '');
    var savedPass = Storage.get('msgr_pass', '');

    if (savedUser && savedPass) {
        // Автовход
        db.ref('accounts/' + savedUser).once('value').then(function(snap) {
            if (snap.exists() && snap.val().password === savedPass) {
                // Проверка бана
                db.ref('bans/' + savedUser).once('value').then(function(banSnap) {
                    if (!banSnap.exists()) {
                        currentUser = savedUser;
                        enterApp();
                    } else {
                        // Не входим
                        document.getElementById('auth-login').value = savedUser;
                    }
                });
            }
        });
    }

    console.log('%cMessenger готов', 'font-size: 18px; color: #4a7cff; font-weight: bold;');
    console.log('%cПромокод OWNER: OWNER-1337-FOREVER', 'font-size: 14px; color: #d4b96a; font-weight: bold;');
}

init();
</script>
